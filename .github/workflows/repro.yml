name: repro
on: pull_request
permissions: {contents: read}
jobs:
  r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.14"}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with: {version: "0.12.3"}
      - run: python tools/setup_env.py dev-platform-release
      - run: |
          export PATH="$PWD/.devenv/venv/bin:$PATH" PYTHONPATH=src
          mkdir out
          python -m dev_platform toolchain verify --profile dev-platform-release --require-certifiable | tee out/x.json || true
          echo "exit=$?"
          which python ruff
