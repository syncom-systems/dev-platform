# Release workflow. Triggered by a version tag. Produces a deterministic archive, attests its build
# provenance (Sigstore, SLSA v1) and SBOM, verifies it with the independent verifier, then publishes.
# Tags containing '-' (e.g. v0.1.0-rc.1) are published as pre-releases; a stable tag whose archive passes
# every check is published as a normal release (state `verified`). Pushing a protected version tag is the
# release decision (ADR 0024); nothing else is required or read. Third-party actions are pinned by commit SHA.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      tree_digest: ${{ steps.pack.outputs.tree_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}  # bootstrap only
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: "0.12.3"}
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Realize the pinned release-profile environment
        run: python tools/setup_env.py dev-platform-release
      - name: Build environment must be certifiable (closure-verified python and ruff)
        env: {VERSION: "${{ steps.meta.outputs.version }}"}
        run: |
          export PATH="$PWD/.devenv/venv/bin:$PATH" PYTHONPATH=src
          mkdir out
          python -m dev_platform toolchain verify --profile dev-platform-release --require-certifiable \
            > "out/dev-platform-$VERSION.build-environment.json" || {
              echo "::error::build environment is not certifiable; diagnostics follow"
              cat "out/dev-platform-$VERSION.build-environment.json"
              exit 1
            }
      - name: Unit tests (pinned interpreter)
        run: PATH="$PWD/.devenv/venv/bin:$PATH" python -m unittest discover -t . -s tests
      - id: pack
        env: {VERSION: "${{ steps.meta.outputs.version }}"}
        run: |
          export PATH="$PWD/.devenv/venv/bin:$PATH" PYTHONPATH=src
          python -m dev_platform release build --version "$VERSION" --out dist \
            --source-uri "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --source-revision "$GITHUB_SHA"
          python -m dev_platform release pack "dist/$VERSION" --out "out/dev-platform-$VERSION.tar.gz"
          sha=$(sha256sum "out/dev-platform-$VERSION.tar.gz" | cut -d' ' -f1)
          tree=$(python -m dev_platform digest "dist/$VERSION")
          echo "$sha  dev-platform-$VERSION.tar.gz" > "out/dev-platform-$VERSION.tar.gz.sha256"
          cp "dist/$VERSION/sbom.cdx.json" "out/dev-platform-$VERSION.sbom.cdx.json"
          echo "archive_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "tree_digest=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/dev-platform-*.tar.gz
            out/dev-platform-*.build-environment.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "out/dev-platform-${{ steps.meta.outputs.version }}.tar.gz"
          sbom-path: "out/dev-platform-${{ steps.meta.outputs.version }}.sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: release-out, path: out/, if-no-files-found: error}

  continuity:
    # Release N-1 (pinned by trust/policy.json) re-runs the full stage over this source. Runs predecessor code,
    # so it holds only a read-only token and no OIDC/attestation permissions; the record is attested by the next job.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: "0.12.3"}
      - name: Predecessor verifies this source (full stage)
        run: |
          mkdir out
          python tools/run_continuity.py --policy trust/policy.json --source . --source-revision "$GITHUB_SHA" \
            --version "${{ needs.build.outputs.version }}" --archive-sha256 "${{ needs.build.outputs.archive_sha256 }}" \
            --out "out/dev-platform-${{ needs.build.outputs.version }}.continuity.json" || exit 1
          ls out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: continuity-record, path: out/, if-no-files-found: ignore}

  attest-continuity:
    needs: [build, continuity]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: continuity-record, path: out}
      - id: have
        run: if ls out/*.continuity.json >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.have.outputs.found == 'true'
        with:
          subject-path: out/dev-platform-*.continuity.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: continuity, path: out/, if-no-files-found: ignore}

  verify:
    # A separate job and runner, read-only token: re-verifies what the build job produced using the
    # independent verifier and the trust policy from the tagged commit.
    needs: [build, attest-continuity]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-out, path: out}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: continuity, path: out}
        continue-on-error: true  # absent only for a first release; the verifier fails if the policy names a predecessor
      - name: Independent verification
        run: |
          cont=""
          if [ -f "out/dev-platform-$VERSION.continuity.json" ]; then cont="--continuity out/dev-platform-$VERSION.continuity.json"; fi
          python tools/verify_release.py "out/dev-platform-$VERSION.tar.gz" \
            --version "$VERSION" --source-revision "$GITHUB_SHA" \
            --archive-sha256 "${{ needs.build.outputs.archive_sha256 }}" \
            --tree-digest "${{ needs.build.outputs.tree_digest }}" \
            --environment "out/dev-platform-$VERSION.build-environment.json" $cont \
            --policy trust/policy.json --out "out/dev-platform-$VERSION.verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: verification, path: "out/dev-platform-*.verification.json"}

  publish:
    needs: [build, attest-continuity, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-out, path: out}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: verification, path: out}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: continuity, path: out}
        continue-on-error: true
      - name: Publish (the state is taken from the verification record)
        run: |
          state=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["acceptance"]["state"])' \
            "out/dev-platform-$VERSION.verification.json")
          case "$state" in
            verified) flag="--latest"; title="dev-platform $VERSION" ;;
            pre-release) flag="--prerelease"; title="dev-platform $VERSION (pre-release)" ;;
            *) echo "::error::unexpected release state $state"; exit 1 ;;
          esac
          notes="Release state: $state. Every check of the release workflow's independent verification job passed
          (provenance, SBOM, build environment and predecessor continuity attestations; archive, revision and
          tree digests). It does not certify any consumer's results.
          Archive sha256: ${{ needs.build.outputs.archive_sha256 }}
          Tree digest (consumer pin): ${{ needs.build.outputs.tree_digest }}
          Source revision: $GITHUB_SHA
          Record: dev-platform-$VERSION.verification.json."
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --verify-tag $flag \
            --title "$title" --notes "$notes"
      - name: Verify the published release is immutable and its assets match
        run: |
          imm=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .immutable)
          if [ "$imm" != "true" ]; then
            echo "::error::release is not immutable (repository setting missing); do not use it"
            exit 1
          fi
          # GitHub creates the release attestation asynchronously after publication (v0.1.1 hit "no
          # attestations" 1s after publishing). Wait a bounded time; any other failure is immediate.
          ok=0
          for i in $(seq 1 20); do
            if out=$(gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1); then ok=1; break; fi
            case "$out" in *"no attestations"*) echo "release attestation not yet available ($i/20)"; sleep 15 ;; *) echo "$out"; exit 1 ;; esac
          done
          if [ "$ok" != 1 ]; then echo "::error::release attestation never appeared: $out"; exit 1; fi
          gh release verify-asset "$GITHUB_REF_NAME" "out/dev-platform-$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY"
