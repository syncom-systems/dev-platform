# Pre-merge: every pull request. Public repository, so these jobs run on GitHub-hosted runners.
# post-merge.yml runs the same jobs on main after a merge.
name: pre-merge
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: verify (dev-platform checks itself)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: "0.13.4"}
      - name: Full-stage self verification
        run: PYTHONPATH=src python -m dev_platform check --stage full --result result.json
      - name: Oldest supported Python (3.11) unit tests
        run: |
          uv run --python 3.11 --no-project env PYTHONPATH=src python -m unittest discover -s tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: result, path: result.json}

  environment:
    # Realizes the pinned release-profile environment from scratch and verifies its closure identity.
    name: environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}  # bootstrap only; the verified python is the one setup_env.py extracts
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: "0.13.4"}
      - run: python tools/setup_env.py
      - run: echo "$PWD/.devenv/venv/bin" >> "$GITHUB_PATH"
      - name: Measure closures
        run: PYTHONPATH=src python -m dev_platform toolchain measure --profile dev-platform-release | tee measure.json
      - name: Verify closures against the manifest
        shell: bash  # -eo pipefail: a non-certifiable environment must fail this step even through tee
        run: |
          PYTHONPATH=src python -m dev_platform toolchain verify --profile dev-platform-release --require-certifiable | tee verify.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: "environment-${{ matrix.os }}", path: "*.json"}

  qualify:
    # REAL execution of the claimed toolchain profiles: real Bazel/rules_rust/rustc and real CPython.
    # A profile in toolchains/manifest.json is only claimed supported on platforms where this passes.
    name: qualify ${{ matrix.profile }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        profile: [python, rust-bazel, rust-bazel-9, rust-cargo, rust-cargo-1.99, rust-bazel-9.3, python-bazel-9.3, rust-python-bazel-9.3, python-ty-bazel-9.3, rust-python-ty-bazel-9.3, rust-aarch64-none-bazel-9.3, rust-python-ty-aarch64-none-bazel-9.3]
        include:
          - {profile: python, fixture: fixtures-real/python-locked}
          - {profile: rust-bazel, fixture: fixtures-real/rust-bazel}
          - {profile: rust-bazel-9, fixture: fixtures-real/rust-bazel-9}
          - {profile: rust-cargo, fixture: fixtures-real/rust-cargo}
          - {profile: rust-cargo-1.99, fixture: fixtures-real/rust-cargo}
          - {profile: rust-bazel-9.3, fixture: fixtures-real/baseline-rust}
          - {profile: python-bazel-9.3, fixture: fixtures-real/baseline-python}
          - {profile: rust-python-bazel-9.3, fixture: fixtures-real/baseline-mixed}
          - {profile: python-ty-bazel-9.3, fixture: fixtures-real/baseline-python}
          - {profile: rust-python-ty-bazel-9.3, fixture: fixtures-real/baseline-mixed}
          - {profile: rust-aarch64-none-bazel-9.3, fixture: fixtures-real/baseline-rust}
          - {profile: rust-python-ty-aarch64-none-bazel-9.3, fixture: fixtures-real/baseline-mixed}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}  # bootstrap only
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: {version: "0.13.4"}
      - run: python tools/setup_env.py ${{ matrix.profile }}
      - name: Qualify (real execution, then must-be-rejected scenarios)
        shell: bash
        run: |
          export PATH="$PWD/.devenv/bin:$PWD/.devenv/rust-dev/bin:$PWD/.devenv/ruff/bin:$PWD/.devenv/rust/bin:$PATH"
          PYTHONPATH=src python -m dev_platform toolchain measure --profile ${{ matrix.profile }} || true
          PY=python; [ -x .devenv/python/bin/python3 ] && PY=.devenv/python/bin/python3
          "$PY" tools/qualify.py --fixture ${{ matrix.fixture }} --profile ${{ matrix.profile }} --negative --app-release --out qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: "qualification-${{ matrix.profile }}-${{ matrix.os }}", path: qualification.json}
