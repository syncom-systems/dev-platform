# Submit the toolchain manifest's tool components to GitHub's dependency graph (issue #6) so that components
# with a supported ecosystem (e.g. pkg:pypi/ruff) receive native Dependabot alerts. Custom TOML pins never do.
# The only write is the dependency snapshot of this repository; no release, tag or content is touched.
name: dependency-submission
on:
  push:
    branches: [main]
    paths: ["toolchains/manifest.json", "src/dev_platform/depsubmit.py", ".github/workflows/dependency-submission.yml"]
  workflow_dispatch:
permissions:
  contents: write # required by the dependency submission API; nothing else is written
jobs:
  submit:
    runs-on: ubuntu-24.04
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.14"}
      - name: Build the snapshot
        run: |
          VERSION=$(python - <<'PY'
          import re, pathlib
          print(re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/dev_platform/__init__.py").read_text())[1])
          PY
          )
          PYTHONPATH=src python -m dev_platform dependency-snapshot --platform-version "$VERSION" \
            --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --job-id "$GITHUB_RUN_ID" \
            --scanned "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out snapshot.json
      - name: Submit
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input snapshot.json
