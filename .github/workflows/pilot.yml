# Genuine consumer pilots (v0.2.0): install a published release with the trusted installer, configure and run
# it against a real public consumer at a pinned commit. Read-only; nothing is pushed to the consumer and no
# acceptance or qualification is implied. See tools/pilot.py and pilot/consumers.json.
name: pilot
on:
  workflow_dispatch:
  pull_request:
    paths: ["pilot/**", "tools/pilot.py", ".github/workflows/pilot.yml"]
permissions:
  contents: read
jobs:
  pilot:
    name: pilot ${{ matrix.consumer }} ${{ matrix.mode }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        consumer: [flight, flight-rust199, reference-bazel]
        mode: [release, head]
        include:
          - {consumer: flight, repo: syncom-systems/flight, commit: a7e3765df73dab120ea240f70cc39cdc4354141c, profile: rust-cargo}
          - {consumer: flight-rust199, repo: syncom-systems/flight, commit: a7e3765df73dab120ea240f70cc39cdc4354141c, profile: rust-cargo-1.99}
          - {consumer: reference-bazel, repo: '', commit: '', profile: rust-bazel-9}
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.14"}
      - name: Fetch the consumer at its pinned commit (read-only, public, no credentials)
        if: matrix.repo != ''
        env: {REPO: "${{ matrix.repo }}", COMMIT: "${{ matrix.commit }}"}
        run: |
          git init -q pilot-consumer
          git -C pilot-consumer fetch -q --depth 1 "https://github.com/$REPO" "$COMMIT"
          git -C pilot-consumer checkout -q --detach FETCH_HEAD
      - name: The consumer commit must equal the pinned one
        if: matrix.repo != ''
        run: test "$(git -C pilot-consumer rev-parse HEAD)" = "${{ matrix.commit }}"
      - name: Pilot (install, configure, execute)
        run: |
          mkdir -p pilot-work
          python tools/pilot.py --consumer-id ${{ matrix.consumer }} --consumer-dir pilot-consumer \
            --work pilot-work --out pilot-result.json --mode ${{ matrix.mode }} --evidence-dir pilot-evidence
      - name: Summary
        if: always()
        run: |
          { echo '```json'; cat pilot-result.json 2>/dev/null || echo '{"error":"no result"}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: "pilot-${{ matrix.consumer }}-${{ matrix.mode }}-${{ matrix.os }}", path: "pilot-result.json"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: "pilot-evidence-${{ matrix.consumer }}-${{ matrix.mode }}-${{ matrix.os }}"
          path: "pilot-evidence"
          if-no-files-found: ignore
  # The execution evidence (result record, consumer pins, proofs, independent verdict) is attested by a job that holds
  # the attestation permission and never checks out or executes consumer code. The attestation says this workflow run
  # produced and handed over these bytes; the verifier (tools/verify_consumer_evidence.py) says they are consistent
  # with the consumer's pins. Neither proves the consumer job was not subverted (docs/consumer-integration.md).
  attest-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: pilot
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: "pilot-evidence-*", path: evidence}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: "evidence/*/*.json"}
