# Post-merge: the pre-merge jobs on main after a merge, because the merged result is not the commit
# the pull request was checked on. Public repository, so these jobs run on GitHub-hosted runners.
name: post-merge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gates:
    name: gates
    uses: ./.github/workflows/pre-merge.yml
