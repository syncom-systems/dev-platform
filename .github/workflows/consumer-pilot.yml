# Reusable, non-disruptive consumer run (docs/consumer-integration.md). A consumer calls this IN ADDITION to its own
# build and security gates: it selects the consumer's pinned platform release, provisions that release's toolchains,
# executes the consumer's dev-platform checks and publishes verifiable execution evidence. It reads only public
# data (the platform repository at the pinned revision, the pinned release archive, the consumer's own repository)
# and never calls an infrastructure provider, so it is safe in untrusted CI. It is not a required check unless the
# consumer decides so. Third-party actions are pinned by commit SHA.
#
# Read-only by construction: the only permission is contents: read, so a caller grants nothing else (attestation is
# a separate workflow, consumer-pilot-attest.yml, called as its own job). The runner workspace holds three sibling
# directories, so nothing the run writes can dirty the consumer's working tree:
#   consumer/   the consumer's repository (the only tree that is checked, built and judged)
#   platform/   the platform source at the pinned revision (read-only input)
#   evidence/   the evidence bundle (uploaded as the artifact `dp-evidence`)
name: consumer-pilot
on:
  workflow_call:
    inputs:
      platform_source_revision:
        description: "Full commit SHA of the pinned platform release (releases/<version>/identity.json source_revision)"
        required: true
        type: string
      allow_unaccepted:
        description: "Use a release published before 0.12.0 as verified-unaccepted"
        required: false
        type: boolean
        default: false
      runs_on:
        required: false
        type: string
        default: ubuntu-24.04
permissions:
  contents: read
jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: syncom-systems/dev-platform
          ref: ${{ inputs.platform_source_revision }}
          path: platform
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.14"}
      - name: Select, provision, execute, verify
        # GH_TOKEN is the job's read-only token, for `gh attestation verify` of the pinned release. It is a step
        # environment variable only (never a persisted Git credential); consumer_run.py hands it to the installer
        # alone and removes it from the environment of every later process, including the consumer's builds.
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_UNACCEPTED: ${{ inputs.allow_unaccepted && '--allow-unaccepted' || '' }}
        run: |
          python platform/tools/consumer_run.py --consumer-dir consumer --work "$RUNNER_TEMP/dp" \
            --evidence-dir evidence --dev-platform-checkout platform $ALLOW_UNACCEPTED
      - name: Summary
        if: always()
        run: |
          { echo '```json'; cat evidence/consumer-run.json 2>/dev/null || echo '{"error":"no record"}'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: dp-evidence, path: evidence, if-no-files-found: ignore}
